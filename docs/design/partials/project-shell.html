<!-- SHARED PROJECT SHELL: sidebar + topbar + main frame -->
<div class="flex min-h-screen bg-background text-foreground">
  <!-- Sidebar -->
  <aside class="fixed left-0 top-0 bottom-0 w-[240px] bg-card border-r border-border z-20 flex flex-col">
    <div class="h-16 flex items-center px-5 border-b border-border">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center mr-3">
        <i data-lucide="message-circle" class="w-5 h-5 text-primary-foreground"></i>
      </div>
      <span class="font-semibold text-lg text-foreground">雅思口语教练</span>
    </div>
    <nav class="flex-1 py-4 px-3 space-y-1">
      <a href="#" data-nav-key="dashboard" data-dom-id="nav-dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
        <i data-lucide="layout-dashboard" class="w-4.5 h-4.5"></i>
        <span>首页</span>
      </a>
      <a href="#" data-nav-key="topics" data-dom-id="nav-topics" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
        <i data-lucide="library" class="w-4.5 h-4.5"></i>
        <span>话题练习</span>
      </a>
      <a href="#" data-nav-key="mock-exam" data-dom-id="nav-mock-exam" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
        <i data-lucide="mic" class="w-4.5 h-4.5"></i>
        <span>模拟考试</span>
      </a>
      <a href="#" data-nav-key="report" data-dom-id="nav-report" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
        <i data-lucide="bar-chart-2" class="w-4.5 h-4.5"></i>
        <span>评分报告</span>
      </a>
      <a href="#" data-nav-key="api-keys" data-dom-id="nav-api-keys" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
        <i data-lucide="key" class="w-4.5 h-4.5"></i>
        <span>API 设置</span>
      </a>
    </nav>
    <div class="p-4 border-t border-border">
      <div class="flex items-center gap-3 px-3 py-2">
        <div class="w-8 h-8 rounded-full bg-muted flex items-center justify-center">
          <i data-lucide="user" class="w-4 h-4 text-muted-foreground"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">备考考生</p>
          <p class="text-xs text-muted-foreground truncate">目标 Band 7.0</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="ml-[240px] flex-1 flex flex-col min-h-screen">
    <!-- Topbar -->
    <header class="h-16 bg-card border-b border-border flex items-center justify-between px-6 sticky top-0 z-10">
      <div class="flex items-center gap-4">
        <h1 class="text-xl font-semibold text-foreground"><!-- SLOT: pageTitle --></h1>
      </div>
      <div class="flex items-center gap-3">
        <button class="p-2 rounded-md text-muted-foreground hover:bg-muted transition-colors" aria-label="通知">
          <i data-lucide="bell" class="w-5 h-5"></i>
        </button>
        <button class="p-2 rounded-md text-muted-foreground hover:bg-muted transition-colors" aria-label="帮助">
          <i data-lucide="help-circle" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-1 p-6 bg-background overflow-auto">
      <!-- SLOT: mainContent -->
    </main>
  </div>
</div>
