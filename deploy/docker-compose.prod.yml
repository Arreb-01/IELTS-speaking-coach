# 生产环境编排（火山引擎 ECS + Docker）
# 用法：见 docs/deployment.md
# 前置：frontend 执行 npm run build，产物复制到 deploy/dist/（或挂载宿主机目录）
services:
  backend:
    build: ../backend
    container_name: ielts-backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://ielts:${POSTGRES_PASSWORD}@db:5432/ielts_coach
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  db:
    image: postgres:16-alpine
    container_name: ielts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ielts_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ielts-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: ielts-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
